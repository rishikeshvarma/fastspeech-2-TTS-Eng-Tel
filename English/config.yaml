# FastSpeech 2 - English (Svarah, Indian-accented English, multi-speaker)
# Merges the reference implementation's preprocess.yaml / model.yaml / train.yaml.
# Relative paths are resolved against this file's folder.

preprocess:
  dataset: "Svarah"
  path:
    corpus_path: "../../data/Svarah"                    # Hugging Face download (parquet)
    raw_path: "../../work/English/raw_data"             # 22.05 kHz wav + .lab per utterance
    lexicon_path: "../fastspeech2/lexicon/librispeech-lexicon.txt"  # reference lexicon
    mfa_dictionary_path: "../../work/English/mfa_dictionary.txt"     # corpus words (+ g2p_en for OOV)
    preprocessed_path: "../../work/English/preprocessed"
    metadata_path: "./metadata"                         # speakers/stats + file lists, kept in the repo
  mfa:
    acoustic_model: "english_us_arpa"                   # pretrained, `mfa model download acoustic english_us_arpa`
  selection:
    seed: 1234
    # hours of speech, i.e. after trimming leading/trailing silence
    train_hours: 5.0
    val_hours: 1.0
    margin: 1.06              # the 30 dB trim over-estimates MFA's trimmed speech by ~5 % here
    trim_top_db: 30
    min_seconds: 1.0          # min/max apply to the trimmed duration
    max_seconds: 15.0
  preprocessing:
    text:
      text_cleaners: []       # the English front-end (text/english.py) produces phones directly
      language: "en"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000          # matches the universal HiFi-GAN vocoder
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True
    max_frames: 1300

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: True         # 115 Svarah speakers with a few minutes each
  max_seq_len: 1300
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  path:
    ckpt_path: "./checkpoints"
    log_path: "./logs"
    result_path: "../Results/English"
  seed: 1234
  num_workers: 2
  use_amp: True               # bf16 autocast: ~1.5x faster on the RTX 5060 Ti in a smoke test
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    # the reference schedule (anneal at 300k/400k/500k of 900k steps) scaled to the
    # shorter run that a 5 h corpus and the deadline allow
    anneal_steps: [30000, 40000, 50000]
    anneal_rate: 0.3
  step:
    total_step: 60000
    log_step: 100
    synth_step: 2000
    val_step: 1000
    save_step: 10000
